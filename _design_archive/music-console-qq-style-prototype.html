<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumora · 音乐底部控制台原型（QQ Music 风格）</title>
<style>
  :root{
    --accent:#7c8cff;
    --accent-cyan:#6ee7ff;
    --accent-pink:#ff7ac6;
    --album-accent:#7c8cff;
    --ease:cubic-bezier(.16,1,.3,1);
    --hairline:rgba(255,255,255,.08);
    --text-1:#fff;
    --text-2:rgba(255,255,255,.82);
    --text-3:rgba(255,255,255,.55);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",Segoe UI,Roboto,sans-serif;
    background:
      radial-gradient(120% 90% at 20% 15%, rgba(124,140,255,.28), transparent 55%),
      radial-gradient(120% 90% at 85% 80%, rgba(255,122,198,.22), transparent 55%),
      radial-gradient(120% 90% at 60% 50%, rgba(110,231,255,.16), transparent 60%),
      #0b0c12;
    color:var(--text-1);
    min-height:100vh; overflow:hidden;
  }
  /* 模拟音乐舞台：封面 + 歌词 */
  .stage{
    position:absolute; inset:0 0 118px 0;
    display:flex; align-items:center; justify-content:center; gap:clamp(44px,7.5vw,92px);
    padding:40px;
  }
  .art{
    width:min(340px,36vw); aspect-ratio:1; border-radius:18px;
    background:linear-gradient(135deg,rgba(124,140,255,.18),rgba(255,122,198,.12));
    box-shadow:0 30px 80px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.06);
    display:flex; align-items:center; justify-content:center;
  }
  .art svg{ width:120px; height:120px; color:rgba(255,255,255,.25); }
  .meta{ color:#fff; max-width:460px; }
  .meta h1{ font-size:clamp(26px,3.2vw,38px); font-weight:700; letter-spacing:-.02em; margin-bottom:8px; }
  .meta p{ font-size:15px; color:var(--text-3); }

  /* ================= 底部全宽控制台（QQ Music 风格） ================= */
  .music-bar{
    position:absolute; left:0; right:0; bottom:0; z-index:30;
    background:rgba(10,11,16,.92);
    border-top:1px solid rgba(255,255,255,.08);
    box-shadow:0 -18px 50px rgba(0,0,0,.45);
    backdrop-filter:blur(22px) saturate(160%);
    -webkit-backdrop-filter:blur(22px) saturate(160%);
    display:flex; flex-direction:column;
  }

  /* 退出提示（参考图同款位置，可关闭/可去掉） */
  .mb-hint{
    position:absolute; bottom:calc(100% + 1px); left:14px;
    padding:5px 10px; border-radius:6px 6px 0 0;
    background:rgba(18,19,28,.96); color:var(--text-3);
    font-size:11px; border:1px solid rgba(255,255,255,.08); border-bottom:0;
  }

  /* 进度条：贴底全宽 */
  .mb-progress{
    display:flex; align-items:center; gap:12px;
    padding:0 18px; height:14px;
  }
  .mb-progress .time{
    font-size:11px; color:var(--text-3); font-variant-numeric:tabular-nums;
    min-width:34px;
  }
  .mb-progress .time.cur{ text-align:right; }
  .mb-progress .time.total{ text-align:left; }
  .mb-track{
    position:relative; flex:1; height:3px; border-radius:99px;
    background:rgba(255,255,255,.12);
  }
  .mb-track .fill{
    position:absolute; inset:0 auto 0 0; width:38%; border-radius:99px; background:var(--album-accent);
    box-shadow:0 0 8px var(--album-accent);
  }
  .mb-track .handle{
    position:absolute; top:50%; left:38%; width:10px; height:10px; border-radius:50%;
    background:#fff; transform:translate(-50%,-50%); opacity:0; transition:opacity .15s ease;
  }
  .mb-track:hover .handle{ opacity:1; }

  /* 主控行 */
  .mb-main{
    display:flex; align-items:center; justify-content:space-between;
    height:78px; padding:0 22px;
  }
  .mb-zone{ display:flex; align-items:center; gap:12px; }
  .mb-zone.center{ gap:20px; position:absolute; left:50%; transform:translateX(-50%); }

  /* 左区：封面 + 曲目信息 + 喜欢 */
  .mb-art{
    width:50px; height:50px; border-radius:8px;
    background:linear-gradient(135deg,rgba(124,140,255,.2),rgba(255,122,198,.14));
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .mb-art svg{ width:22px; height:22px; color:rgba(255,255,255,.35); }
  .mb-info{ display:flex; flex-direction:column; gap:3px; min-width:120px; }
  .mb-title{ font-size:13px; font-weight:600; color:#fff; white-space:nowrap; }
  .mb-artist{ font-size:12px; color:var(--text-3); white-space:nowrap; }
  .mb-actions{ display:flex; align-items:center; gap:6px; margin-left:4px; }

  /* 按钮系统 */
  .btn{
    display:inline-flex; align-items:center; justify-content:center;
    width:36px; height:36px; border:none; border-radius:50%;
    background:transparent; color:var(--text-2); cursor:pointer; outline:none;
    transition:background .18s ease, color .18s ease, transform .12s ease;
  }
  .btn:hover{ background:rgba(255,255,255,.08); color:#fff; }
  .btn:active{ transform:scale(.92); }
  .btn svg{ width:20px; height:20px; fill:currentColor; }
  .btn svg path[fill="none"]{ fill:none; }
  .btn.liked{ color:#ff5d8f; }
  .btn.liked svg{ fill:#ff5d8f; }
  .btn.primary{
    width:46px; height:46px;
    background:linear-gradient(135deg,var(--accent-cyan),var(--accent) 55%,var(--accent-pink));
    color:#0b0c12; box-shadow:0 6px 20px rgba(124,140,255,.45);
  }
  .btn.primary svg{ width:24px; height:24px; }
  .btn.primary:hover{ filter:brightness(1.08); }
  .btn.sm{ width:32px; height:32px; }
  .btn.sm svg{ width:18px; height:18px; }
  .lyric-glyph{ font-size:15px; font-weight:700; line-height:1; }

  /* 音量 popover */
  .vol{ position:relative; }
  .vol .pop{
    position:absolute; bottom:calc(100% + 12px); left:50%;
    transform:translateX(-50%) translateY(6px);
    width:120px; padding:8px 12px; border-radius:12px;
    background:rgba(20,22,32,.96); border:1px solid rgba(255,255,255,.1);
    box-shadow:0 12px 36px rgba(0,0,0,.5); opacity:0; pointer-events:none;
    transition:opacity .18s var(--ease), transform .18s var(--ease);
  }
  .vol:hover .pop{ opacity:1; pointer-events:auto; transform:translateX(-50%) translateY(0); }
  .vbar{ position:relative; height:5px; border-radius:99px; background:rgba(255,255,255,.14); }
  .vbar .vfill{ position:absolute; inset:0 20% 0 0; border-radius:99px; background:var(--album-accent); }
  .vbar .vhandle{ position:absolute; top:50%; right:20%; width:11px; height:11px; border-radius:50%; background:#fff; transform:translate(50%,-50%); }

  @media (max-width:720px){
    .mb-main{ padding:0 14px; }
    .mb-zone.center{ position:static; transform:none; }
    .mb-info{ display:none; }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="art">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
  </div>
  <div class="meta">
    <h1>The Middle</h1>
    <p>Jada Facer · 参考布局预览</p>
  </div>
</div>

<div class="music-bar" role="group" aria-label="音乐播放控制">
  <div class="mb-hint">点击这里或者 Esc 键退出播放页</div>

  <div class="mb-progress">
    <span class="time cur">00:00</span>
    <div class="mb-track" role="slider" aria-label="播放进度" aria-valuenow="38" aria-valuemin="0" aria-valuemax="100">
      <div class="fill"></div>
      <div class="handle"></div>
    </div>
    <span class="time total">02:17</span>
  </div>

  <div class="mb-main">
    <!-- 左区：封面 + 信息 + 喜欢 -->
    <div class="mb-zone left">
      <div class="mb-art">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
      </div>
      <div class="mb-info">
        <span class="mb-title">The Middle</span>
        <span class="mb-artist">Jada Facer</span>
      </div>
      <div class="mb-actions">
        <button class="btn liked" title="喜欢" aria-label="喜欢">
          <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        </button>
      </div>
    </div>

    <!-- 中区：播放控制 hero -->
    <div class="mb-zone center">
      <button class="btn sm" title="随机播放" aria-label="随机播放">
        <svg viewBox="0 0 24 24"><path d="M10.59 9.17 5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
      </button>
      <button class="btn" title="上一首" aria-label="上一首">
        <svg viewBox="0 0 24 24"><path d="M7 6v12M19 6l-9 6 9 6z"/></svg>
      </button>
      <button class="btn primary" title="播放 / 暂停" aria-label="播放或暂停">
        <svg viewBox="0 0 24 24"><rect x="7" y="5.5" width="4" height="13" rx="1"/><rect x="13" y="5.5" width="4" height="13" rx="1"/></svg>
      </button>
      <button class="btn" title="下一首" aria-label="下一首">
        <svg viewBox="0 0 24 24"><path d="M17 6v12M5 6l9 6-9 6z"/></svg>
      </button>
      <button class="btn sm" title="循环模式" aria-label="循环模式">
        <svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
      </button>
    </div>

    <!-- 右区：音量 / EQ / 词 / 列表 / 睡眠 / 设置 / 全屏 -->
    <div class="mb-zone right">
      <div class="vol">
        <button class="btn" title="音量" aria-label="音量">
          <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 9.5a3.5 3.5 0 0 1 0 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
        <div class="pop" role="slider" aria-label="音量" aria-valuenow="80" aria-valuemin="0" aria-valuemax="100" tabindex="0">
          <div class="vbar"><div class="vfill"></div><div class="vhandle"></div></div>
        </div>
      </div>
      <button class="btn" title="均衡器" aria-label="均衡器">
        <svg viewBox="0 0 24 24"><rect x="4" y="11" width="3" height="7" rx="1" fill="currentColor"/><rect x="10.5" y="6" width="3" height="12" rx="1" fill="currentColor"/><rect x="17" y="9" width="3" height="9" rx="1" fill="currentColor"/></svg>
      </button>
      <button class="btn" title="桌面歌词" aria-label="桌面歌词"><span class="lyric-glyph">词</span></button>
      <button class="btn" title="播放列表" aria-label="播放列表">
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="2" rx="1" fill="currentColor"/><rect x="3" y="11" width="18" height="2" rx="1" fill="currentColor"/><rect x="3" y="17" width="12" height="2" rx="1" fill="currentColor"/></svg>
      </button>
      <button class="btn" title="睡眠定时" aria-label="睡眠定时">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 7.5V12l3 2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="btn" title="设置" aria-label="设置">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
      <button class="btn" title="全屏" aria-label="全屏">
        <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>
</div>

</body>
</html>
