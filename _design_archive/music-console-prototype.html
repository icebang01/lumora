<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumora · 音乐控制台布局原型</title>
<style>
  :root{
    --accent:#7c8cff;
    --accent-cyan:#6ee7ff;
    --accent-pink:#ff7ac6;
    --album-accent:#7c8cff;
    --ease:cubic-bezier(.16,1,.3,1);
    --hairline:rgba(255,255,255,.08);
    --text-1:#fff;
    --text-2:rgba(255,255,255,.82);
    --text-3:rgba(255,255,255,.55);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",Segoe UI,Roboto,sans-serif;
    background:
      radial-gradient(120% 90% at 20% 15%, rgba(124,140,255,.28), transparent 55%),
      radial-gradient(120% 90% at 85% 80%, rgba(255,122,198,.22), transparent 55%),
      radial-gradient(120% 90% at 60% 50%, rgba(110,231,255,.16), transparent 60%),
      #0b0c12;
    color:var(--text-1);
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; padding:40px;
    overflow:hidden;
  }
  /* 模糊封面背景，营造音乐模式氛围（仅用于预览上下文） */
  .stage-bg{
    position:fixed; inset:-40px; z-index:-1;
    background:
      radial-gradient(40% 40% at 30% 35%, rgba(124,140,255,.35), transparent 70%),
      radial-gradient(45% 45% at 75% 65%, rgba(255,122,198,.28), transparent 70%),
      rgba(10,11,18,.6);
    filter:blur(60px) saturate(140%);
  }

  /* ============ 控制台卡片（替代视频 OSC） ============ */
  .console{
    width:min(680px,92vw);
    display:flex; flex-direction:column; gap:18px;
    padding:20px 24px;
    border-radius:22px;
    background:rgba(18,19,28,.55);
    border:1px solid var(--hairline);
    box-shadow:0 18px 50px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.06);
    backdrop-filter:blur(22px) saturate(160%);
    -webkit-backdrop-filter:blur(22px) saturate(160%);
  }

  /* 进度条：当前时间 | 轨道 | 总时间 */
  .seek{ display:flex; align-items:center; gap:12px; }
  .seek .time{
    flex:0 0 auto; min-width:42px;
    font-variant-numeric:tabular-nums; font-size:13px; color:var(--text-2);
  }
  .seek .time.cur{ text-align:left; }
  .seek .time.total{ text-align:right; }
  .seek .track{
    position:relative; flex:1; height:6px; border-radius:99px;
    background:rgba(0,0,0,.35);
    box-shadow:inset 0 1px 2px rgba(0,0,0,.4), 0 0 0 1px rgba(255,255,255,.06);
  }
  .seek .track .fill{
    position:absolute; inset:0 auto 0 0; width:38%; border-radius:99px; background:#fff;
    box-shadow:0 0 10px var(--album-accent), 0 0 18px -3px var(--album-accent);
  }
  .seek .track .handle{
    position:absolute; top:50%; left:38%; width:14px; height:14px; border-radius:50%;
    background:#fff; transform:translate(-50%,-50%);
    box-shadow:0 2px 8px rgba(0,0,0,.45), 0 0 0 2px var(--album-accent);
  }

  /* 控制行：三区（左/中/右）用 space-between 分隔，组内统一 gap */
  .row{ display:flex; align-items:center; justify-content:space-between; }
  .group{ display:flex; align-items:center; gap:12px; }   /* ★ 统一间距：所有同级按钮 12px */
  .group.center{ gap:14px; }                               /* 仅 hero 两侧略宽，营造焦点 */

  .btn{
    display:inline-flex; align-items:center; justify-content:center;
    width:40px; height:40px; border:none; border-radius:50%;
    background:transparent; color:var(--text-2); cursor:pointer; outline:none;
    transition:background .18s ease, color .18s ease, transform .12s ease;
  }
  .btn:hover{ background:rgba(255,255,255,.1); color:#fff; }
  .btn:active{ transform:scale(.92); }
  .btn svg{ width:22px; height:22px; fill:currentColor; }
  .btn svg path[fill="none"]{ fill:none; }
  .btn.ghost{ color:var(--text-3); }                       /* 次级控制：降权，建立层级 */
  .btn.ghost:hover{ color:var(--text-2); }
  .btn.liked{ color:#ff5d8f; }
  .btn.liked svg{ fill:#ff5d8f; filter:drop-shadow(0 2px 6px rgba(255,93,143,.5)); }
  .btn.active{ color:var(--accent); }
  .btn.active svg{ fill:var(--accent); filter:drop-shadow(0 2px 6px rgba(124,140,255,.5)); }
  .lyric-glyph{ font-size:18px; font-weight:700; line-height:1; }

  /* 播放/暂停 hero：渐变 + 辉光，视觉焦点 */
  .btn.primary{
    width:56px; height:56px;
    background:linear-gradient(135deg,var(--accent-cyan),var(--accent) 55%,var(--accent-pink));
    color:#0b0c12; box-shadow:0 8px 24px rgba(124,140,255,.45);
  }
  .btn.primary svg{ width:26px; height:26px; }
  .btn.primary:hover{ color:#0b0c12; filter:brightness(1.08); }

  /* 音量：hover 时在按钮上方浮出毛玻璃小面板（不挤压行内间距，无重叠） */
  .vol{ position:relative; }
  .vol .pop{
    position:absolute; bottom:calc(100% + 12px); left:50%;
    transform:translateX(-50%) translateY(6px);
    display:flex; align-items:center; gap:8px;
    width:128px; padding:8px 12px; border-radius:12px;
    background:rgba(20,22,32,.94);
    backdrop-filter:blur(18px) saturate(150%); -webkit-backdrop-filter:blur(18px) saturate(150%);
    border:1px solid rgba(255,255,255,.1);
    box-shadow:0 12px 36px rgba(0,0,0,.5);
    opacity:0; pointer-events:none; transition:opacity .18s var(--ease), transform .18s var(--ease);
  }
  .vol:hover .pop{ opacity:1; pointer-events:auto; transform:translateX(-50%) translateY(0); }
  .vol .pop .vbar{
    position:relative; flex:1; height:6px; border-radius:99px;
    background:rgba(255,255,255,.14);
  }
  .vol .pop .vbar .vfill{
    position:absolute; inset:0 auto 0 0; width:80%; border-radius:99px;
    background:var(--album-accent);
  }
  .vol .pop .vbar .vhandle{
    position:absolute; top:50%; right:20%; width:13px; height:13px; border-radius:50%;
    background:#fff; transform:translate(50%,-50%); box-shadow:0 2px 6px rgba(0,0,0,.45);
  }
  .vol .pop::after{
    content:""; position:absolute; top:100%; left:50%; transform:translateX(-50%);
    border:6px solid transparent; border-top-color:rgba(20,22,32,.94);
  }

  .cap{
    position:fixed; bottom:18px; left:0; right:0; text-align:center;
    font-size:12px; color:var(--text-3); letter-spacing:.02em;
  }
</style>
</head>
<body>
  <div class="stage-bg"></div>

  <div class="console" role="group" aria-label="音乐播放控制（原型）">
    <!-- 进度条 -->
    <div class="seek">
      <span class="time cur">1:24</span>
      <div class="track" role="slider" aria-label="播放进度" aria-valuenow="38" aria-valuemin="0" aria-valuemax="100">
        <div class="fill"></div>
        <div class="handle"></div>
      </div>
      <span class="time total">3:42</span>
    </div>

    <!-- 控制行：左(次级) / 中(hero) / 右(工具) -->
    <div class="row">
      <!-- 左：随机 / 循环（次级，降权） -->
      <div class="group left">
        <button class="btn ghost" title="随机播放" aria-label="随机播放">
          <svg viewBox="0 0 24 24"><path d="M10.59 9.17 5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
        </button>
        <button class="btn ghost" title="循环模式" aria-label="循环模式">
          <svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
        </button>
      </div>

      <!-- 中：上一首 / 播放·暂停 / 下一首（hero） -->
      <div class="group center">
        <button class="btn" title="上一首" aria-label="上一首">
          <svg viewBox="0 0 24 24"><path d="M7 6v12M19 6l-9 6 9 6z"/></svg>
        </button>
        <button class="btn primary" title="播放 / 暂停" aria-label="播放或暂停">
          <svg viewBox="0 0 24 24"><path d="M8 5.5 L19 12 L8 18.5 Z"/></svg>
        </button>
        <button class="btn" title="下一首" aria-label="下一首">
          <svg viewBox="0 0 24 24"><path d="M17 6v12M5 6l9 6-9 6z"/></svg>
        </button>
      </div>

      <!-- 右：音量 / 列表 / 全屏 / 词 / 喜欢 / 均衡器 / 设置 / 睡眠 -->
      <div class="group right">
        <div class="vol">
          <button class="btn" title="音量" aria-label="音量">
            <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 9.5a3.5 3.5 0 0 1 0 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          </button>
          <div class="pop" role="slider" aria-label="音量" aria-valuenow="80" aria-valuemin="0" aria-valuemax="100" tabindex="0">
            <div class="vbar"><div class="vfill"></div><div class="vhandle"></div></div>
          </div>
        </div>
        <button class="btn" title="播放列表" aria-label="播放列表">
          <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="2" rx="1" fill="currentColor"/><rect x="3" y="11" width="18" height="2" rx="1" fill="currentColor"/><rect x="3" y="17" width="12" height="2" rx="1" fill="currentColor"/></svg>
        </button>
        <button class="btn" title="全屏" aria-label="全屏">
          <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
        </button>
        <button class="btn" title="桌面歌词" aria-label="桌面歌词"><span class="lyric-glyph">词</span></button>
        <button class="btn liked" title="喜欢" aria-label="喜欢">
          <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        </button>
        <button class="btn active" title="均衡器" aria-label="均衡器">
          <svg viewBox="0 0 24 24"><rect x="4" y="11" width="3" height="7" rx="1" fill="currentColor"/><rect x="10.5" y="6" width="3" height="12" rx="1" fill="currentColor"/><rect x="17" y="9" width="3" height="9" rx="1" fill="currentColor"/></svg>
        </button>
        <button class="btn" title="设置" aria-label="设置">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
        <button class="btn" title="睡眠定时" aria-label="睡眠定时">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 7.5V12l3 2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
  </div>

  <div class="cap">音乐控制台布局原型 · 统一间距 12px + 三区分组（左次级 / 中 hero / 右工具）· 音量改为悬停浮出面板</div>
</body>
</html>
