<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Lumora 音乐控制台原型 — 参考图版</title>
<style>
  :root {
    --bg: #0b0c12;
    --text-1: #f2f4ff;
    --text-2: rgba(242,244,255,.72);
    --text-3: rgba(242,244,255,.45);
    --hairline: rgba(255,255,255,.09);
    --c-cyan: #6ee7ff;
    --c-accent: #7c8cff;
    --c-pink: #ff7ac6;
    --grad: linear-gradient(120deg, #6ee7ff, #7c8cff 55%, #ff7ac6);
    --ease: cubic-bezier(.16,1,.3,1);
    --blue: #4d8dff; /* 参考图播放键的蓝 */
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Segoe UI Variable Display", "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif;
    background:
      radial-gradient(70% 60% at 30% 30%, rgba(124,140,255,.10), transparent 65%),
      radial-gradient(50% 50% at 75% 70%, rgba(255,122,198,.06), transparent 60%),
      var(--bg);
    color: var(--text-1);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }

  /* 顶部窗口控制（模拟） */
  .winbar {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    padding: 12px 16px;
    z-index: 5;
  }
  .winbtn {
    width: 14px; height: 14px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,.18);
    background: transparent;
    cursor: default;
  }

  /* ── 主体：左封面 + 右歌词 ── */
  .main {
    flex: 1;
    display: grid;
    grid-template-columns: 42% 1fr;
    align-items: center;
    gap: 48px;
    padding: 8px 64px 20px;
    min-height: 0;
  }

  .art-wrap {
    display: flex;
    justify-content: center;
  }
  .art {
    position: relative;
    width: min(340px, 30vw);
    aspect-ratio: 1;
    border-radius: 14px;
    background:
      radial-gradient(120% 90% at 30% 20%, #1c3a5e 0%, #12233c 45%, #0a1524 100%);
    box-shadow:
      0 30px 70px rgba(0,0,0,.55),
      inset 0 1px 0 rgba(255,255,255,.14),
      inset 0 0 0 1px rgba(255,255,255,.06);
    display: grid;
    place-items: center;
    overflow: hidden;
  }
  .art::before { /* 参考图的树剪影感 */
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(40% 28% at 50% 78%, rgba(8,14,24,.9), transparent 70%),
      conic-gradient(from 210deg at 50% 96%, transparent 0 40deg, rgba(10,18,32,.85) 40deg 120deg, transparent 120deg 200deg, rgba(10,18,32,.85) 200deg 280deg, transparent 280deg);
    opacity: .8;
  }
  .art .note {
    position: relative;
    z-index: 1;
    width: 34%;
    opacity: .5;
  }
  .spectrum {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 26%;
    opacity: .85;
  }

  .right {
    display: flex;
    flex-direction: column;
    gap: 22px;
    min-width: 0;
    height: 100%;
    justify-content: center;
  }
  .meta-title {
    font-size: clamp(20px, 2vw, 26px);
    font-weight: 700;
    letter-spacing: .01em;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .badge {
    font-size: 10px; font-weight: 700;
    color: #1a1b24; background: #ffd66b;
    padding: 1px 6px; border-radius: 4px;
  }
  .meta-artist {
    font-size: 13px; color: var(--text-2);
    margin-top: 6px;
    display: flex; align-items: center; gap: 8px;
  }
  .disclaimer {
    font-size: 10px; color: var(--text-3);
    margin-top: 8px;
  }

  /* 歌词：竖排列表，当前行浅蓝高亮 */
  .lyrics {
    flex: 1;
    min-height: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 4px;
    max-width: 520px;
  }
  .line {
    font-size: 14px;
    color: rgba(255,255,255,.38);
    padding: 4px 10px;
    border-radius: 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .line.cur {
    color: #9cc2ff;              /* 参考图浅蓝高亮 */
    font-size: 16px;
    font-weight: 600;
    background: rgba(77,141,255,.10);
  }

  /* ── 底部控制台：单行紧凑（参考图） ── */
  .console {
    background: rgba(10,11,16,.92);
    backdrop-filter: blur(22px) saturate(160%);
    -webkit-backdrop-filter: blur(22px) saturate(160%);
    border-top: 1px solid rgba(255,255,255,.08);
    padding: 12px 28px 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  /* 进度条：独立一行，细 */
  .progress {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .time { font-size: 11px; color: var(--text-3); font-variant-numeric: tabular-nums; min-width: 34px; }
  .time.total { text-align: right; }
  .seek {
    flex: 1;
    height: 3px;
    border-radius: 2px;
    background: rgba(255,255,255,.12);
    position: relative;
    cursor: pointer;
  }
  .seek .fill {
    position: absolute;
    inset: 0 auto 0 0;
    width: 26.6%; /* 00:16/01:00 */
    border-radius: 2px;
    background: linear-gradient(90deg, var(--c-cyan), var(--c-accent));
    box-shadow: 0 0 8px rgba(124,140,255,.5);
  }
  .seek .knob {
    position: absolute;
    left: 26.6%;
    top: 50%;
    width: 9px; height: 9px;
    transform: translate(-50%,-50%);
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 8px rgba(0,0,0,.5);
  }

  /* 控制行 */
  .controls {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .ctl {
    width: 34px; height: 34px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: var(--text-2);
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: background .2s var(--ease), color .2s var(--ease), transform .2s var(--ease);
  }
  .ctl:hover { background: rgba(255,255,255,.08); color: #fff; transform: translateY(-1px); }
  .ctl svg { width: 18px; height: 18px; fill: currentColor; }
  .ctl svg.line { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  .ctl--play {
    width: 40px; height: 40px;
    background: linear-gradient(135deg, #6ea8ff, var(--blue) 60%, #3a6df0);
    color: #fff;
    box-shadow: 0 6px 20px rgba(77,141,255,.45);
  }
  .ctl--play:hover {
    background: linear-gradient(135deg, #7db5ff, #5a97ff 60%, #4a7cf5);
    box-shadow: 0 8px 26px rgba(77,141,255,.6);
    transform: translateY(-1px);
  }
  .ctl--play svg { width: 20px; height: 20px; margin-left: 2px; }

  .vol-group { display: flex; align-items: center; gap: 2px; }
  .vol {
    width: 64px; height: 3px;
    border-radius: 2px;
    background: rgba(255,255,255,.14);
    position: relative;
  }
  .vol .fill {
    position: absolute; inset: 0 auto 0 0; width: 70%;
    border-radius: 2px; background: rgba(255,255,255,.75);
  }

  .sep {
    width: 1px; height: 20px;
    background: rgba(255,255,255,.10);
    margin: 0 10px;
  }
  .spacer { flex: 1; }

  /* 右侧图标按钮组 */
  .icon-btn {
    width: 32px; height: 32px;
    border: none;
    background: transparent;
    color: var(--text-2);
    border-radius: 50%;
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: background .2s var(--ease), color .2s var(--ease);
  }
  .icon-btn:hover { background: rgba(255,255,255,.08); color: #fff; }
  .icon-btn svg { width: 17px; height: 17px; fill: currentColor; }
  .icon-btn svg.line { fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .icon-btn .count { font-size: 11px; margin-left: 2px; }
  .icon-btn.text { width: auto; padding: 0 10px; border-radius: 14px; font-size: 12px; font-weight: 600; color: var(--text-2); }
  .icon-btn.text:hover { color: #fff; }

  .note-tag {
    position: fixed;
    left: 50%; bottom: 8px;
    transform: translateX(-50%);
    font-size: 11px; color: var(--text-3);
  }
</style>
</head>
<body>

  <div class="winbar">
    <span class="winbtn"></span><span class="winbtn"></span><span class="winbtn"></span>
  </div>

  <!-- 主体：左封面 + 右歌词 -->
  <div class="main">
    <div class="art-wrap">
      <div class="art">
        <svg class="note" viewBox="0 0 24 24" fill="#dfe8ff">
          <path d="M9 17V5l10-2v12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="6.5" cy="17.5" r="2.6" fill="currentColor"/>
          <circle cx="16.5" cy="15.5" r="2.6" fill="currentColor"/>
        </svg>
        <svg class="spectrum" viewBox="0 0 200 40" preserveAspectRatio="none">
          <rect x="4"  y="14" width="8" height="26" rx="2" fill="#7c8cff" opacity=".9"/>
          <rect x="16" y="8"  width="8" height="32" rx="2" fill="#6ee7ff" opacity=".85"/>
          <rect x="28" y="18" width="8" height="22" rx="2" fill="#7c8cff" opacity=".9"/>
          <rect x="40" y="6"  width="8" height="34" rx="2" fill="#ff7ac6" opacity=".75"/>
          <rect x="52" y="12" width="8" height="28" rx="2" fill="#6ee7ff" opacity=".85"/>
          <rect x="64" y="20" width="8" height="20" rx="2" fill="#7c8cff" opacity=".9"/>
          <rect x="76" y="10" width="8" height="30" rx="2" fill="#ff7ac6" opacity=".75"/>
          <rect x="88" y="16" width="8" height="24" rx="2" fill="#6ee7ff" opacity=".85"/>
          <rect x="100" y="8" width="8" height="32" rx="2" fill="#7c8cff" opacity=".9"/>
          <rect x="112" y="22" width="8" height="18" rx="2" fill="#ff7ac6" opacity=".75"/>
          <rect x="124" y="12" width="8" height="28" rx="2" fill="#6ee7ff" opacity=".85"/>
          <rect x="136" y="18" width="8" height="22" rx="2" fill="#7c8cff" opacity=".9"/>
          <rect x="148" y="6"  width="8" height="34" rx="2" fill="#ff7ac6" opacity=".75"/>
          <rect x="160" y="14" width="8" height="26" rx="2" fill="#6ee7ff" opacity=".85"/>
          <rect x="172" y="20" width="8" height="20" rx="2" fill="#7c8cff" opacity=".9"/>
          <rect x="184" y="10" width="8" height="30" rx="2" fill="#ff7ac6" opacity=".75"/>
        </svg>
      </div>
    </div>

    <div class="right">
      <div>
        <div class="meta-title">树的花语 <span class="badge">VIP</span></div>
        <div class="meta-artist">李毅恩 Lye <span class="badge">VIP</span></div>
        <div class="disclaimer">【未经著作权人许可不得翻唱翻录或使用】</div>
      </div>
      <div class="lyrics">
        <div class="line">是谁的期许</div>
        <div class="line">的花语</div>
        <div class="line cur">落叶飘下</div>
        <div class="line">是谁的叹息</div>
        <div class="line">在这片宁静里</div>
        <div class="line">回答藏在泥土里</div>
        <div class="line">风轻轻说</div>
        <div class="line">别追问太多</div>
        <div class="line">花开花落</div>
      </div>
    </div>
  </div>

  <!-- 底部控制台：单行紧凑（参考图） -->
  <div class="console">
    <div class="progress">
      <span class="time">00:16</span>
      <div class="seek"><div class="fill"></div><div class="knob"></div></div>
      <span class="time total">01:00</span>
    </div>
    <div class="controls">
      <!-- 左组：循环/上/播放/下/音量 -->
      <button class="ctl" title="循环">
        <svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
      </button>
      <button class="ctl" title="上一首">
        <svg viewBox="0 0 24 24"><path d="M7 6v12M19 6l-9 6 9 6z"/></svg>
      </button>
      <button class="ctl ctl--play" title="播放/暂停">
        <svg viewBox="0 0 24 24"><path d="M8 5.5 L19 12 L8 18.5 Z"/></svg>
      </button>
      <button class="ctl" title="下一首">
        <svg viewBox="0 0 24 24"><path d="M17 6v12M5 6l9 6-9 6z"/></svg>
      </button>
      <div class="vol-group">
        <button class="ctl" title="音量">
          <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path class="line" d="M16 9.5a3.5 3.5 0 0 1 0 5"/></svg>
        </button>
        <div class="vol"><div class="fill"></div></div>
      </div>

      <div class="spacer"></div>

      <!-- 右组：喜欢/不喜欢/评论/更多 -->
      <button class="icon-btn" title="喜欢" style="color:#ff6b81">
        <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
      </button>
      <button class="icon-btn" title="不喜欢">
        <svg viewBox="0 0 24 24" class="line"><path d="M5 3v12H3V3h2zm14 0v12h-2V3h2zm-3-2H8a2 2 0 0 0-1.98 1.77L5.4 12.5a1 1 0 0 0 .98 1.17H11l-1.2 4.85A1.5 1.5 0 0 0 11.23 20l4.77-5.5V1z" fill="currentColor" stroke="none"/></svg>
      </button>
      <button class="icon-btn" title="评论">
        <svg viewBox="0 0 24 24" class="line"><path d="M4 5h16v11H8l-4 4V5z"/></svg>
        <span class="count">210</span>
      </button>
      <button class="icon-btn" title="更多">
        <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.8" fill="currentColor"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/><circle cx="19" cy="12" r="1.8" fill="currentColor"/></svg>
      </button>

      <span class="sep"></span>

      <!-- 功能组：词/均衡/倍速/伴 -->
      <button class="icon-btn text" title="歌词">词</button>
      <button class="icon-btn" title="均衡器">
        <svg viewBox="0 0 24 24"><rect x="4" y="11" width="3" height="7" rx="1" fill="currentColor"/><rect x="10.5" y="6" width="3" height="12" rx="1" fill="currentColor"/><rect x="17" y="9" width="3" height="9" rx="1" fill="currentColor"/></svg>
      </button>
      <button class="icon-btn text" title="倍速">1.0×</button>
      <button class="icon-btn text" title="伴唱">伴</button>
    </div>
  </div>

  <p class="note-tag">原型 v1 · 参考图：单行紧凑控制台（时间/循环/播放/音量 + 喜欢/评论/更多 + 词/均衡/倍速/伴）</p>
</body>
</html>
