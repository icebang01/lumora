<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lumora — idle 双栏布局预览 v2</title>
<style>
  :root{
    --accent:#7c8cff;
    --accent-bright:#9aa6ff;
    --text-1:rgba(255,255,255,.92);
    --text-2:rgba(255,255,255,.6);
    --text-3:rgba(255,255,255,.38);
    --hairline:rgba(255,255,255,.10);
    --glass:rgba(255,255,255,.05);
    --ease:cubic-bezier(.16,1,.3,1);
    --grad:linear-gradient(135deg,#6ee7ff,#8b7bff 55%,#ff7ac6);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
    background:
      radial-gradient(80% 60% at 50% 50%, rgba(124,140,255,.08), transparent 70%),
      #0b0c12;
    color:var(--text-1);
    -webkit-font-smoothing:antialiased;
  }
  /* ===== idle 双栏布局 ===== */
  #idle-screen{
    position:fixed; inset:0;
    display:flex;
    overflow:hidden;
  }
  /* 左侧：原始 idle 内容（logo + 标题 + 快捷键 + 继续观看） */
  .idle-aside{
    width:280px;
    flex:0 0 280px;
    height:100%;
    padding:64px 30px 40px;
    display:flex;
    flex-direction:column;
    gap:22px;
    border-right:1px solid var(--hairline);
    background:rgba(255,255,255,.025);
    backdrop-filter:blur(22px) saturate(160%);
    -webkit-backdrop-filter:blur(22px) saturate(160%);
    overflow-y:auto;
  }
  .aside-hero{display:flex;flex-direction:column;align-items:flex-start;gap:10px}
  .aside-mark{width:48px;height:48px}
  .aside-title{
    font-size:32px;font-weight:700;margin:0;letter-spacing:.5px;line-height:1;
    background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .aside-sub{margin:0;font-size:13px;color:var(--text-2)}
  .aside-sub strong{color:var(--text-1);font-weight:600}
  .aside-divider{height:1px;background:var(--hairline);margin:2px 0}
  /* 继续观看卡片 */
  .resume-card{
    position:relative;
    display:flex;align-items:center;gap:14px;
    padding:14px 16px;
    background:var(--glass);
    border:1px solid rgba(255,255,255,.12);
    border-radius:14px;
    cursor:pointer;
    transition:transform .2s var(--ease), border-color .2s var(--ease), background .2s var(--ease);
  }
  .resume-card::before{
    content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:3px;
    background:linear-gradient(180deg,#6ee7ff,#8b7bff 55%,#ff7ac6);
  }
  .resume-card:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.22);background:rgba(255,255,255,.08)}
  .resume-ic{
    width:40px;height:40px;border-radius:10px;flex:0 0 40px;
    display:grid;place-items:center;background:rgba(255,255,255,.06);color:var(--accent-bright);
  }
  .resume-ic svg{width:18px;height:18px;fill:currentColor}
  .resume-meta .lbl{font-size:11px;color:var(--text-3);margin-bottom:2px}
  .resume-meta .ttl{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}
  .resume-meta .sub{font-size:11px;color:var(--text-2);margin-top:2px}
  .resume-go{
    margin-left:auto;font-size:11px;color:var(--accent-bright);
    border:1px solid rgba(124,140,255,.4);border-radius:8px;padding:4px 8px;white-space:nowrap;
  }
  /* 快捷键区（可折叠，默认收起） */
  .aside-shorts{margin-top:auto}
  .shorts-head{
    display:flex;align-items:center;justify-content:space-between;
    font-size:12px;color:var(--text-2);margin-bottom:10px;cursor:pointer;user-select:none;
  }
  .shorts-head .tag{font-size:10px;color:var(--text-3);border:1px solid var(--hairline);border-radius:6px;padding:1px 6px}
  .shorts-list{display:flex;flex-direction:column;gap:7px}
  .shorts-list.collapsed{display:none}
  .hint-row{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text-2)}
  .hint-keys{display:flex;gap:3px;flex:0 0 auto}
  .hint-keys kbd{
    font-family:inherit;font-size:11px;min-width:20px;text-align:center;
    padding:2px 5px;border-radius:5px;background:rgba(255,255,255,.07);
    border:1px solid var(--hairline);color:var(--text-1);
  }
  /* ===== 右侧主区：仅媒体库 ===== */
  .idle-main{
    flex:1 1 auto;
    height:100%;
    overflow-y:auto;
    padding:72px 48px 96px;
  }
  .library{margin-top:8px;max-width:1100px}
  .library-head{display:flex;align-items:center;gap:14px;padding-bottom:12px;border-bottom:1px solid var(--hairline);flex-wrap:wrap}
  .library-title{font-size:18px;font-weight:600}
  .library-tabs{display:flex;gap:4px}
  .lib-tab{
    font:inherit;font-size:12px;color:var(--text-2);cursor:pointer;
    border:1px solid transparent;border-radius:8px;padding:4px 12px;background:transparent;
    transition:.18s var(--ease);
  }
  .lib-tab.active{color:var(--text-1);background:rgba(124,140,255,.16);border-color:rgba(124,140,255,.35)}
  .lib-tab:hover{color:var(--text-1)}
  .lib-search{
    margin-left:auto;font:inherit;font-size:12px;color:var(--text-1);
    background:rgba(255,255,255,.06);border:1px solid var(--hairline);border-radius:9px;
    padding:6px 12px;min-width:160px;outline:none;
  }
  .lib-search:focus{border-color:rgba(124,140,255,.5)}
  .poster-grid{
    margin-top:22px;
    display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:18px;
  }
  .poster{
    position:relative;aspect-ratio:2/3;border-radius:12px;overflow:hidden;
    background:var(--ph,#2a2d3a);cursor:pointer;
    border:1px solid var(--hairline);
    transition:transform .22s var(--ease), box-shadow .22s var(--ease), border-color .22s var(--ease);
  }
  .poster:hover{transform:translateY(-4px);border-color:rgba(124,140,255,.5);
    box-shadow:0 14px 36px rgba(0,0,0,.4), 0 0 0 1px rgba(124,140,255,.25)}
  .poster .glow{position:absolute;inset:auto 0 0 0;height:50%;
    background:linear-gradient(to top, rgba(0,0,0,.55), transparent)}
  .poster .nm{position:absolute;left:10px;right:10px;bottom:9px;font-size:12px;font-weight:600;
    color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .poster .fab{
    position:absolute;right:9px;bottom:9px;width:30px;height:30px;border-radius:50%;
    display:grid;place-items:center;background:var(--accent);color:#0b0c12;
    opacity:0;transform:scale(.8);transition:.22s var(--ease);box-shadow:0 6px 18px rgba(124,140,255,.5)}
  .poster:hover .fab{opacity:1;transform:scale(1)}
  .poster .fab svg{width:14px;height:14px;fill:currentColor}
  /* 细滚动条 */
  .idle-aside::-webkit-scrollbar,.idle-main::-webkit-scrollbar{width:8px}
  .idle-aside::-webkit-scrollbar-thumb,.idle-main::-webkit-scrollbar-thumb{
    background:rgba(255,255,255,.14);border-radius:8px;border:2px solid transparent;background-clip:padding-box}
  .idle-aside::-webkit-scrollbar-thumb:hover,.idle-main::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.24)}
  /* 响应式：窄窗回归单栏 */
  @media (max-width:860px){
    #idle-screen{flex-direction:column;overflow-y:auto}
    .idle-aside{width:100%;flex:none;height:auto;border-right:none;border-bottom:1px solid var(--hairline);padding:36px 24px}
    .idle-main{padding:32px 24px 80px}
    .aside-shorts{margin-top:18px}
  }
</style>
</head>
<body>
  <div id="idle-screen">
    <!-- 左侧：原始 idle 内容 -->
    <aside class="idle-aside">
      <div class="aside-hero">
        <svg class="aside-mark" viewBox="0 0 64 64" width="48" height="48">
          <defs>
            <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#6ee7ff"/>
              <stop offset="55%" stop-color="#8b7bff"/>
              <stop offset="100%" stop-color="#ff7ac6"/>
            </linearGradient>
          </defs>
          <circle cx="32" cy="32" r="27" fill="none" stroke="url(#lg)" stroke-width="1.6" opacity=".45"/>
          <circle cx="32" cy="32" r="20" fill="none" stroke="url(#lg)" stroke-width="1" opacity=".25"/>
          <path d="M26 21.5 L45 32 L26 42.5 Z" fill="url(#lg)"/>
        </svg>
        <h1 class="aside-title">Lumora</h1>
        <p class="aside-sub">拖入文件，或<strong>双击</strong>打开</p>
      </div>

      <div class="aside-divider"></div>

      <div class="resume-card" title="继续观看">
        <div class="resume-ic">
          <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </div>
        <div class="resume-meta">
          <div class="lbl">继续观看</div>
          <div class="ttl">星际穿越 Interstellar</div>
          <div class="sub">02:14:33 / 02:49:10</div>
        </div>
        <span class="resume-go">从此处继续</span>
      </div>

      <div class="aside-divider"></div>

      <div class="aside-shorts">
        <div class="shorts-head" onclick="document.querySelector('.shorts-list').classList.toggle('collapsed')">
          <span>快捷键</span>
          <span class="tag">点击 / ? 展开</span>
        </div>
        <div class="shorts-list collapsed">
          <div class="hint-row"><span class="hint-keys"><kbd>空格</kbd></span><span>播放 / 暂停</span></div>
          <div class="hint-row"><span class="hint-keys"><kbd>←</kbd><kbd>→</kbd></span><span>跳转 5 秒</span></div>
          <div class="hint-row"><span class="hint-keys"><kbd>,</kbd><kbd>.</kbd></span><span>逐帧</span></div>
          <div class="hint-row"><span class="hint-keys"><kbd>I</kbd></span><span>统计面板</span></div>
          <div class="hint-row"><span class="hint-keys"><kbd>F</kbd></span><span>全屏</span></div>
          <div class="hint-row"><span class="hint-keys"><kbd>?</kbd></span><span>切换快捷键</span></div>
        </div>
      </div>
    </aside>

    <!-- 右侧主区：仅媒体库 -->
    <main class="idle-main">
      <section class="library" aria-label="媒体库">
        <div class="library-head">
          <span class="library-title">媒体库</span>
          <div class="library-tabs">
            <button class="lib-tab active">全部</button>
            <button class="lib-tab">视频</button>
            <button class="lib-tab">音乐</button>
          </div>
          <input class="lib-search" type="search" placeholder="搜索…">
        </div>

        <div class="poster-grid">
          <div class="poster" style="--ph:linear-gradient(135deg,#3a2d5a,#6e3a7a)"><div class="glow"></div><div class="nm">星际穿越</div><div class="fab"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div></div>
          <div class="poster" style="--ph:linear-gradient(135deg,#1f4a5a,#2a7a6e)"><div class="glow"></div><div class="nm">海上钢琴师</div><div class="fab"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div></div>
          <div class="poster" style="--ph:linear-gradient(135deg,#5a2d3a,#7a3a55)"><div class="glow"></div><div class="nm">盗梦空间</div><div class="fab"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div></div>
          <div class="poster" style="--ph:linear-gradient(135deg,#2d3a5a,#3a5a8b)"><div class="glow"></div><div class="nm">银翼杀手 2049</div><div class="fab"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div></div>
          <div class="poster" style="--ph:linear-gradient(135deg,#3a5a2d,#5a7a3a)"><div class="glow"></div><div class="nm">千与千寻</div><div class="fab"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div></div>
          <div class="poster" style="--ph:linear-gradient(135deg,#5a4a2d,#7a6a3a)"><div class="glow"></div><div class="nm">花样年华</div><div class="fab"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div></div>
          <div class="poster" style="--ph:linear-gradient(135deg,#2d5a5a,#3a8b8b)"><div class="glow"></div><div class="nm">降临</div><div class="fab"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div></div>
          <div class="poster" style="--ph:linear-gradient(135deg,#4a2d5a,#6a3a7a)"><div class="glow"></div><div class="nm">黑客帝国</div><div class="fab"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div></div>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
